name: US Top 100 Proxies

on:
  push:
    branches: [main]
    paths:
      - 'tools/us_top100.py'
      - '.github/workflows/us-top100.yml'
  workflow_dispatch:
  schedule:
    # Every Friday at 21:15 China Standard Time (13:15 UTC)
    - cron: "15 13 * * 5"

env:
  SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

permissions:
  contents: read

concurrency:
  group: us-top100
  cancel-in-progress: false

jobs:
  build:
    # GitHub-hosted jobs support up to 6 hours. Reserve 5 hours for repeated attempts.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Repeatedly discover, verify and rank US egress nodes (up to 5 hours)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p output/attempts
          deadline=$((SECONDS + 18000))
          attempt=0
          success=0

          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            remaining=$((deadline - SECONDS))
            attempt_limit=3000
            if (( remaining < attempt_limit )); then
              attempt_limit=$remaining
            fi

            echo "========== ROUND ${attempt}; remaining budget: ${remaining}s =========="
            set +e
            timeout --signal=TERM --kill-after=30 "${attempt_limit}s" \
              python -u tools/us_top100.py 2>&1 | tee "output/attempts/round-${attempt}.log"
            rc=${PIPESTATUS[0]}
            set -e

            if [[ -f output/report.json ]]; then
              cp output/report.json "output/attempts/round-${attempt}-report.json"
            fi

            if (( rc == 0 )); then
              success=1
              echo "SUCCESS on round ${attempt}"
              break
            fi

            echo "Round ${attempt} did not produce a verified subscription (exit=${rc})."
            if (( SECONDS >= deadline )); then
              break
            fi
            echo "Waiting 30 seconds before refreshing sources and trying again..."
            sleep 30
          done

          {
            echo "attempts=${attempt}"
            echo "success=${success}"
            echo "time_budget_seconds=18000"
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee output/overnight-summary.txt

          if (( success == 0 )); then
            echo "No verified US-egress subscription was produced within the five-hour run."
            exit 1
          fi

      - name: Upload results and all attempt logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-top100-${{ github.run_number }}
          path: |
            output/us_top100.yaml
            output/report.json
            output/overnight-summary.txt
            output/attempts/
          if-no-files-found: warn
          retention-days: 7
