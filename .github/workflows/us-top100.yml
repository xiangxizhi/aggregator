name: US Top 50 Proxies

on:
  push:
    branches: [main]
    paths:
      - 'tools/us_top100.py'
      - 'subscribe/clash.py'
      - '.github/workflows/us-top100.yml'
  workflow_dispatch:
  schedule:
    # Weekly refresh: Friday 21:15 China Standard Time
    - cron: "15 13 * * 5"

env:
  SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

permissions:
  contents: read

# A new Top-20 run must not wait behind the previous five-hour job.
concurrency:
  group: us-top50-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # One complete discovery/verification pass per run; upload its report immediately.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover, strictly verify and rank up to 50 diverse US egress nodes
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p output/attempts
          echo "========== SINGLE PASS: US TOP 50 =========="
          set +e
          python -u tools/us_top100.py 2>&1 | tee output/attempts/round-1.log
          rc=${PIPESTATUS[0]}
          set -e
          if [[ -f output/report.json ]]; then
            cp output/report.json output/attempts/round-1-report.json
          fi
          finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "target_count=50"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "exit_code=${rc}"
            echo "finished_utc=${finished_utc}"
          } | tee output/round-summary.txt

          # Keep an immutable, run-specific copy so later runs never replace it.
          archive="output/history/us-top50-${GITHUB_RUN_ID}"
          mkdir -p "${archive}"
          if [[ -f output/us_top50.yaml ]]; then
            cp output/us_top20.yaml "${archive}/us-top50-${GITHUB_RUN_ID}.yaml"
          fi
          if [[ -f output/report.json ]]; then
            cp output/report.json "${archive}/report-${GITHUB_RUN_ID}.json"
          fi
          cp output/round-summary.txt "${archive}/summary-${GITHUB_RUN_ID}.txt"
          cp output/attempts/round-1.log "${archive}/round-1-${GITHUB_RUN_ID}.log" 2>/dev/null || true
          exit "${rc}"

      - name: Upload this round's report, subscription and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-top50-run-${{ github.run_id }}
          path: |
            output/history/
            output/us_top20.yaml
            output/report.json
            output/round-summary.txt
            output/attempts/
          if-no-files-found: warn
          retention-days: 90
