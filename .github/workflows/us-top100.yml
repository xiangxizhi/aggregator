name: US Top 100 Proxies

on:
  push:
    branches: [main]
    paths:
      - 'tools/us_top100.py'
      - '.github/workflows/us-top100.yml'
  workflow_dispatch:
  schedule:
    # Every Friday at 21:15 China Standard Time (13:15 UTC)
    - cron: "15 13 * * 5"

env:
  SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

permissions:
  contents: read

concurrency:
  group: us-top100
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build and rank US nodes
        run: python -u tools/us_top100.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-top100-${{ github.run_number }}
          path: |
            output/us_top100.yaml
            output/report.json
          if-no-files-found: warn
          retention-days: 7
