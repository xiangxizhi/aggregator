name: US Top 20 Proxies

on:
  push:
    branches: [main]
    paths:
      - 'tools/us_top100.py'
      - '.github/workflows/us-top100.yml'
  workflow_dispatch:
  schedule:
    # Weekly refresh: Friday 21:15 China Standard Time
    - cron: "15 13 * * 5"

env:
  SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

permissions:
  contents: read

# A new Top-20 run must not wait behind the previous five-hour job.
concurrency:
  group: us-top20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One complete discovery/verification pass per run; upload its report immediately.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover, verify and rank up to 20 US egress nodes
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p output/attempts
          echo "========== SINGLE PASS: US TOP 20 =========="
          set +e
          python -u tools/us_top100.py 2>&1 | tee output/attempts/round-1.log
          rc=${PIPESTATUS[0]}
          set -e
          if [[ -f output/report.json ]]; then
            cp output/report.json output/attempts/round-1-report.json
          fi
          {
            echo "target_count=20"
            echo "exit_code=${rc}"
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee output/round-summary.txt
          exit "${rc}"

      - name: Upload this round's report, subscription and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-top20-${{ github.run_number }}
          path: |
            output/us_top20.yaml
            output/report.json
            output/round-summary.txt
            output/attempts/
          if-no-files-found: warn
          retention-days: 14
