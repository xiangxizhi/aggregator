name: US Italy Japan Top 60 Proxies

on:
  push:
    branches: [main]
    paths:
      - 'tools/us_top100.py'
      - 'subscribe/clash.py'
      - '.github/workflows/us-top100.yml'
  workflow_dispatch:
  schedule:
    # Every 6 hours (UTC; also 00:00, 06:00, 12:00, 18:00 China time)
    - cron: "0 */6 * * *"

env:
  SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

permissions:
  contents: write

# Keep each three-country run isolated.
concurrency:
  group: tri-country-top60-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # One complete discovery/verification pass per run; upload its report immediately.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover, verify and rank up to 20 nodes each from US, Italy and Japan
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p output/attempts
          echo "========== SINGLE PASS: US / ITALY / JAPAN TOP 60 =========="
          set +e
          python -u tools/us_top100.py 2>&1 | tee output/attempts/round-1.log
          rc=${PIPESTATUS[0]}
          set -e
          if [[ -f output/report.json ]]; then
            cp output/report.json output/attempts/round-1-report.json
          fi
          finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "target_count=60"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "exit_code=${rc}"
            echo "finished_utc=${finished_utc}"
          } | tee output/round-summary.txt

          # Keep every run/attempt in a separate immutable directory and file.
          archive="output/history/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          subscription="output/history/tri_country_top60_run_${GITHUB_RUN_ID}_attempt_${GITHUB_RUN_ATTEMPT}.yaml"
          mkdir -p "${archive}"
          if [[ -f output/report.json ]]; then
            cp output/report.json "${archive}/report-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}.json"
          fi
          cp output/round-summary.txt "${archive}/summary-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}.txt"
          cp output/attempts/round-1.log "${archive}/round-1-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}.log" 2>/dev/null || true
          if [[ "${rc}" -eq 0 && -f "${subscription}" ]]; then
            # Stable phone subscription URL: update only after a fully successful run.
            cp "${subscription}" output/tri_country_top60_latest.yaml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${subscription}" "${archive}" output/tri_country_top60_latest.yaml
            if ! git diff --cached --quiet; then
              git commit -m "Archive verified US Italy Japan Top 60 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
              git push
            fi
          fi
          exit "${rc}"

      - name: Upload this round's report, subscription and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tri-country-top60-run-${{ github.run_id }}
          path: |
            output/history/run-${{ github.run_id }}-attempt-${{ github.run_attempt }}/
            output/history/tri_country_top60_run_${{ github.run_id }}_attempt_${{ github.run_attempt }}.yaml
            output/report.json
            output/round-summary.txt
            output/attempts/
          if-no-files-found: warn
          retention-days: 90
